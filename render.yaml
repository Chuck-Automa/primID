databases:
  - name: primid-db
    databaseName: primid
    user: primid_user
    plan: free

services:
  # ── Backend (Node.js Web Service) ──────────────────────────────────────────
  - type: web
    name: primid-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: primid-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true            # Render generates a secure random value
      - key: CORS_ORIGIN
        sync: false                    # Set manually in Render dashboard → frontend URL
      # Twilio — set in Render dashboard after Sprint 1
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Apple OAuth
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false

  # ── Frontend (React Static Site) ───────────────────────────────────────────
  - type: static
    name: primid-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html      # SPA fallback for react-router
    envVars:
      - key: REACT_APP_API_URL
        sync: false                   # Set to backend service URL (e.g. https://primid-backend.onrender.com)
      - key: REACT_APP_GOOGLE_CLIENT_ID
        sync: false
