<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="primID — privacy-preserving proof of personhood" />
    <title>primID</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        background: #f8f9fa;
        color: #1a1a2e;
      }
      /* Prevent iOS Safari from auto-zooming on input/select focus.
         Safari zooms when font-size < 16px; setting 16px globally avoids it. */
      input, select, textarea { font-size: 16px; }
    </style>
    <script>
      // 1. Suppress cross-origin "Script error." messages (e.g. Brave wallet extension scripts)
      //    from CRA's dev error overlay — they have no actionable info and aren't our code.
      window.addEventListener('error', function(e) {
        if (e.message === 'Script error.' || !e.filename) {
          e.stopImmediatePropagation();
        }
      }, true);
      // 2. Provide a configurable window.ethereum placeholder so Brave's wallet init
      //    doesn't crash when it runs before its own provider is ready.
      //    configurable:true means Brave can still overwrite it with the real provider.
      if (typeof window.ethereum === 'undefined') {
        Object.defineProperty(window, 'ethereum', { value: {}, writable: true, configurable: true });
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
