databases:
  - name: primid-db
    databaseName: primid
    user: primid_user
    plan: free

services:
  # ── Backend (Node.js Web Service) ──────────────────────────────────────────
  - type: web
    name: primid-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci --ignore-scripts && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: development
      - key: DATABASE_URL
        fromDatabase:
          name: primid-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true            # Render generates a secure random value
      - key: CORS_ORIGIN
        sync: false                    # Set manually in Render dashboard → frontend URL
      # ALE encryption — generate with: openssl rand -hex 32
      # Dev/staging: 32-byte hex key. Prod: leave blank and set ALE_KMS_KEY_ARN for KMS-derived key.
      - key: ALE_ENCRYPTION_KEY
        sync: false
      - key: ALE_KMS_KEY_ARN
        sync: false
      # HMAC key — MUST differ from ALE_ENCRYPTION_KEY. Generate with: openssl rand -hex 32
      - key: HMAC_SECRET
        sync: false
      # Inverted phone verification — listener number shown to the user in the UI.
      # Sprint 1: set to a placeholder (e.g. "STAGING"). Sprint 2: real Telnyx number.
      - key: LISTENER_NUMBER
        sync: false
      # Android SMS Gateway (interim inbound provider) — prohibited in prod; this
      # blueprint is prod-only (NODE_ENV=production above), so PHONE_LISTENER_PROVIDER
      # is hardcoded to stub and FEATURE_PHONE_VERIFICATION_LIVE hardcoded false here.
      # Staging's own Render service instance (configured separately, outside this
      # blueprint) sets PHONE_LISTENER_PROVIDER=android and the flag manually.
      - key: PHONE_LISTENER_PROVIDER
        value: stub
      - key: FEATURE_PHONE_VERIFICATION_LIVE
        value: "false"
      - key: ANDROID_LISTENER_NUMBER
        sync: false
      - key: ANDROID_HEARTBEAT_STALE_AFTER_S
        value: "600"
      - key: PHONE_MAINTENANCE_NOTICE
        sync: false
      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Apple OAuth
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      # GitHub Category B crawler — fine-grained PAT, zero repo/org permissions,
      # issued from the Foundation's GitHub org account. Fails fast at boot if
      # absent. See CLAUDE_CATEGORY_B_VERIFICATION.md.
      - key: GITHUB_PAT
        sync: false
      - key: CATEGORY_B_PROVIDER
        value: live
      - key: CATEGORY_B_STUB_HANDLES
        sync: false

  # ── Frontend (React Static Site) ───────────────────────────────────────────
  - type: static
    name: primid-frontend
    rootDir: frontend
    buildCommand: npm ci --ignore-scripts --legacy-peer-deps && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html      # SPA fallback for react-router
    envVars:
      - key: REACT_APP_API_URL
        sync: false                   # Set to backend service URL (e.g. https://primid-backend.onrender.com)
      - key: REACT_APP_GOOGLE_CLIENT_ID
        sync: false

  # ── Social Listener (Web Service) ───────────────────────────────────────────
  # type: web (not worker) — the Android phone webhook adapter needs a bound
  # port/public URL to receive inbound webhooks from the capcom6 gateway app;
  # Render Background Workers get neither. HMAC signature verification (fail
  # closed, mandatory) plus the replay window are the actual perimeter control,
  # not network placement — the Android device is a roaming SIM with no fixed
  # IP to allowlist regardless. Sprint 2 Reddit polling — disabled by default,
  # set REDDIT_SOCIAL_LISTENER=true once credentials are configured. The
  # listener shares backend Prisma/crypto code via relative imports so the
  # build installs both backend and listener dependencies.
  - type: web
    name: primid-social-listener
    runtime: node
    buildCommand: cd backend && npm ci --ignore-scripts && npx prisma generate && cd ../primid-social-listener && npm ci --ignore-scripts
    startCommand: node primid-social-listener/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: primid-db
          property: connectionString
      - key: ALE_ENCRYPTION_KEY
        sync: false
      - key: ALE_KMS_KEY_ARN
        sync: false
      - key: HMAC_SECRET
        sync: false
      - key: REDDIT_SOCIAL_LISTENER
        value: "false"                  # set to "true" once Reddit credentials are configured
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_REFRESH_TOKEN
        sync: false
      # Telegram Category A adapter — this service is already type:web (bound
      # port) for the Android webhook, so TELEGRAM_LISTENER_MODE=webhook shares
      # it rather than needing a second service. Leave mode "off" until the
      # bot token + setWebhook registration (secret_token = TELEGRAM_WEBHOOK_SECRET)
      # are done — see CLAUDE_CATEGORY_A_VERIFICATION.md / PLAN_telegram_listener.md.
      - key: TELEGRAM_SOCIAL_LISTENER
        value: "false"
      - key: TELEGRAM_LISTENER_MODE
        value: "off"                    # off | polling | webhook — polling is dev-only, never set here
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Android SMS Gateway — prohibited in prod by a boot-time guard in index.js
      # regardless of this value; hardcoded stub here since this blueprint is
      # prod-only. Staging's own service instance sets PHONE_LISTENER_PROVIDER=android
      # and ANDROID_FORWARDER_HMAC_SECRET manually (outside this blueprint).
      - key: PHONE_LISTENER_PROVIDER
        value: stub
      - key: ANDROID_FORWARDER_HMAC_SECRET
        sync: false
      - key: ANDROID_FORWARDER_REPLAY_WINDOW_S
        value: "660"
